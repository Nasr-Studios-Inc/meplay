<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>MePlay — Cosmic Boot Animation</title>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>

  <!-- Babylon GLB/GLTF loader -->
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020414;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ============================================================
       LOADING UI
       ============================================================ */

    #loadingUI {
      position: fixed;

      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      width: min(360px, calc(100vw - 48px));

      z-index: 50;

      pointer-events: none;

      opacity: 1;

      transition:
        opacity .6s ease;
    }

    #loadingUI.hidden {
      opacity: 0;
    }

    #loadingText {
      margin-bottom: 9px;

      color: rgba(255,255,255,.9);

      font-size: 11px;
      font-weight: 600;

      letter-spacing: .18em;

      text-transform: uppercase;

      text-align: center;

      text-shadow:
        0 0 10px rgba(130,160,255,.9),
        0 0 24px rgba(90,100,255,.5);
    }

    #loadingBarOuter {
      width: 100%;
      height: 4px;

      border-radius: 999px;

      background: rgba(255,255,255,.12);

      overflow: hidden;

      box-shadow:
        0 0 12px rgba(100,120,255,.15);
    }

    #loadingBar {
      width: 0%;

      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          rgba(115,85,255,.9),
          rgba(150,190,255,1),
          rgba(255,255,255,1)
        );

      box-shadow:
        0 0 8px rgba(140,170,255,.9),
        0 0 20px rgba(100,100,255,.55);

      transition:
        width .25s ease;
    }

    #loadingPercent {
      margin-top: 7px;

      color: rgba(255,255,255,.48);

      font-size: 9px;

      letter-spacing: .12em;

      text-align: center;
    }


    /* ============================================================
       STATUS
       ============================================================ */

    #status {
      position: fixed;

      left: 50%;

      bottom: max(92px, calc(env(safe-area-inset-bottom) + 92px));

      transform: translateX(-50%);

      z-index: 40;

      color: rgba(255,255,255,.9);

      font-size: 12px;
      font-weight: 500;

      letter-spacing: .2em;

      text-transform: uppercase;

      opacity: 0;

      transition:
        opacity .45s ease;

      pointer-events: none;

      white-space: nowrap;

      text-shadow:
        0 0 10px rgba(120,160,255,.9),
        0 0 30px rgba(90,100,255,.5);
    }

    #status.show {
      opacity: 1;
    }


    /* ============================================================
       LOADING WARNING
       ============================================================ */

    #timeoutWarning {
      position: fixed;

      top: max(18px, env(safe-area-inset-top) + 18px);

      right: 18px;

      width: min(360px, calc(100vw - 36px));

      z-index: 100;

      padding: 15px 17px;

      border-radius: 12px;

      background:
        rgba(18, 18, 35, .88);

      border:
        1px solid rgba(255,255,255,.18);

      box-shadow:
        0 10px 35px rgba(0,0,0,.35),
        0 0 25px rgba(110,100,255,.18);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      color: rgba(255,255,255,.9);

      font-size: 12px;

      line-height: 1.5;

      opacity: 0;

      transform:
        translateY(-12px);

      pointer-events: none;

      transition:
        opacity .4s ease,
        transform .4s ease;
    }

    #timeoutWarning.show {
      opacity: 1;

      transform:
        translateY(0);
    }

    #timeoutWarningTitle {
      margin-bottom: 5px;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: .08em;

      text-transform: uppercase;

      color: white;
    }

    #timeoutWarningText {
      color: rgba(255,255,255,.68);
    }


    /* ============================================================
       FLASH
       ============================================================ */

    #flash {
      position: fixed;

      inset: 0;

      z-index: 80;

      background: white;

      opacity: 0;

      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>


<!-- ============================================================
     LOADING UI
     ============================================================ -->

<div id="loadingUI">

  <div id="loadingText">
    Initializing MePlay
  </div>

  <div id="loadingBarOuter">
    <div id="loadingBar"></div>
  </div>

  <div id="loadingPercent">
    0%
  </div>

</div>


<div id="status">
  Entering MePlay
</div>


<!-- ============================================================
     TIMEOUT WARNING
     ============================================================ -->

<div id="timeoutWarning">

  <div id="timeoutWarningTitle">
    MePlay is taking longer than usual
  </div>

  <div id="timeoutWarningText">
    It's taking longer than usual to load. Try rebooting too,
    or if the problem persists, wait an extra 1 minute for an
    error code to appear, then contact support.
  </div>

</div>


<div id="flash"></div>


<script>
(() => {

  "use strict";


  /* ================================================================
     DOM
     ================================================================ */

  const canvas =
    document.getElementById("canvas");

  const loadingUI =
    document.getElementById("loadingUI");

  const loadingText =
    document.getElementById("loadingText");

  const loadingBar =
    document.getElementById("loadingBar");

  const loadingPercent =
    document.getElementById("loadingPercent");

  const status =
    document.getElementById("status");

  const timeoutWarning =
    document.getElementById("timeoutWarning");

  const flash =
    document.getElementById("flash");


  /* ================================================================
     ENGINE
     ================================================================ */

  const engine =
    new BABYLON.Engine(
      canvas,
      true,
      {
        antialias: true,
        preserveDrawingBuffer: true,
        stencil: true
      },
      true
    );


  /* ================================================================
     SCENE
     ================================================================ */

  const scene =
    new BABYLON.Scene(engine);

  scene.clearColor =
    new BABYLON.Color4(
      0.002,
      0.004,
      0.025,
      1
    );


  /* ================================================================
     CAMERA
     ================================================================ */

  const camera =
    new BABYLON.UniversalCamera(
      "camera",
      new BABYLON.Vector3(
        0,
        0,
        10
      ),
      scene
    );

  camera.fov =
    0.72;

  camera.minZ =
    0.05;

  camera.maxZ =
    5000;

  camera.setTarget(
    BABYLON.Vector3.Zero()
  );


  /* ================================================================
     LIGHTING
     ================================================================ */

  const sun =
    new BABYLON.DirectionalLight(
      "sun",
      new BABYLON.Vector3(
        -0.5,
        -0.7,
        -1
      ),
      scene
    );

  sun.intensity =
    1.35;

  sun.diffuse =
    new BABYLON.Color3(
      1,
      0.96,
      0.86
    );


  const hemi =
    new BABYLON.HemisphericLight(
      "hemi",
      new BABYLON.Vector3(
        0.2,
        1,
        0.3
      ),
      scene
    );

  hemi.intensity =
    0.6;

  hemi.diffuse =
    new BABYLON.Color3(
      0.65,
      0.78,
      1
    );

  hemi.groundColor =
    new BABYLON.Color3(
      0.025,
      0.035,
      0.09
    );


  const rim =
    new BABYLON.PointLight(
      "rim",
      new BABYLON.Vector3(
        -5,
        3,
        6
      ),
      scene
    );

  rim.intensity =
    18;

  rim.diffuse =
    new BABYLON.Color3(
      0.22,
      0.4,
      1
    );


  /* ================================================================
     STAR FIELD
     ================================================================ */

  const STAR_COUNT =
    1800;

  const starPositions =
    [];

  const starColors =
    [];


  for (
    let i = 0;
    i < STAR_COUNT;
    i++
  ) {

    const radius =
      35 +
      Math.random() * 130;

    const theta =
      Math.random() *
      Math.PI *
      2;

    const phi =
      Math.acos(
        2 * Math.random() - 1
      );


    starPositions.push(

      radius *
      Math.sin(phi) *
      Math.cos(theta),

      radius *
      Math.cos(phi),

      radius *
      Math.sin(phi) *
      Math.sin(theta)

    );


    const tint =
      Math.random();


    if (
      tint < 0.2
    ) {

      starColors.push(
        0.55,
        0.72,
        1
      );

    }
    else if (
      tint < 0.38
    ) {

      starColors.push(
        0.86,
        0.64,
        1
      );

    }
    else {

      starColors.push(
        1,
        0.97,
        1
      );

    }

  }


  const stars =
    new BABYLON.Mesh(
      "stars",
      scene
    );


  const starData =
    new BABYLON.VertexData();


  starData.positions =
    starPositions;

  starData.colors =
    starColors;


  starData.applyToMesh(
    stars,
    true
  );


  const starMaterial =
    new BABYLON.StandardMaterial(
      "starMaterial",
      scene
    );


  starMaterial.pointsCloud =
    true;

  starMaterial.pointSize =
    2;

  starMaterial.disableLighting =
    true;

  starMaterial.emissiveColor =
    new BABYLON.Color3(
      1,
      1,
      1
    );

  starMaterial.alpha =
    0.9;


  stars.material =
    starMaterial;


  /* ================================================================
     EARTH ROOT
     ================================================================ */

  const earthRoot =
    new BABYLON.TransformNode(
      "EarthRoot",
      scene
    );


  earthRoot.position =
    BABYLON.Vector3.Zero();

  earthRoot.rotation =
    BABYLON.Vector3.Zero();

  earthRoot.scaling =
    new BABYLON.Vector3(
      0.001,
      0.001,
      0.001
    );


  let earthMeshes =
    [];

  let earthReady =
    false;

  let earthRadius =
    1.4;


  /* ================================================================
     EARTH LOADING
     ================================================================ */

  async function loadEarth() {

    console.log(
      "MEPLAY: Loading local Earth GLB..."
    );


    try {

      const container =
        await BABYLON.SceneLoader.LoadAssetContainerAsync(
          "./",
          "earth-cartoon.glb",
          scene
        );


      console.log(
        "MEPLAY: Earth GLB loaded.",
        container
      );


      container.addAllToScene();


      const importedRoots =
        container.rootNodes.slice();


      importedRoots.forEach(
        node => {

          if (
            node &&
            node !== earthRoot
          ) {

            node.parent =
              earthRoot;

          }

        }
      );


      earthMeshes =
        container.meshes.filter(
          mesh =>
            mesh &&
            mesh !== stars &&
            mesh.getTotalVertices() > 0
        );


      if (
        earthMeshes.length === 0
      ) {

        throw new Error(
          "Earth GLB loaded, but no renderable meshes were found."
        );

      }


      earthRoot.position =
        BABYLON.Vector3.Zero();

      earthRoot.rotation =
        BABYLON.Vector3.Zero();

      earthRoot.scaling =
        BABYLON.Vector3.One();


      earthRoot.computeWorldMatrix(
        true
      );


      earthMeshes.forEach(
        mesh => {

          mesh.computeWorldMatrix(
            true
          );

        }
      );


      let minimum =
        new BABYLON.Vector3(
          Infinity,
          Infinity,
          Infinity
        );


      let maximum =
        new BABYLON.Vector3(
          -Infinity,
          -Infinity,
          -Infinity
        );


      earthMeshes.forEach(
        mesh => {

          const bounding =
            mesh.getBoundingInfo();

          if (
            !bounding
          ) {

            return;

          }


          const box =
            bounding.boundingBox;


          minimum =
            BABYLON.Vector3.Minimize(
              minimum,
              box.minimumWorld
            );


          maximum =
            BABYLON.Vector3.Maximize(
              maximum,
              box.maximumWorld
            );

        }
      );


      const dimensions =
        maximum.subtract(
          minimum
        );


      const center =
        minimum
          .add(maximum)
          .scale(0.5);


      const largestDimension =
        Math.max(
          dimensions.x,
          dimensions.y,
          dimensions.z
        );


      if (
        !Number.isFinite(
          largestDimension
        ) ||
        largestDimension <= 0
      ) {

        throw new Error(
          "Invalid Earth model dimensions."
        );

      }


      earthRoot.position =
        center.scale(-1);


      const targetDiameter =
        2.8;


      const modelScale =
        targetDiameter /
        largestDimension;


      earthRoot.scaling =
        new BABYLON.Vector3(
          modelScale,
          modelScale,
          modelScale
        );


      earthRadius =
        targetDiameter / 2;


      earthRoot.computeWorldMatrix(
        true
      );


      earthMeshes.forEach(
        mesh => {

          mesh.computeWorldMatrix(
            true
          );

        }
      );


      earthReady =
        true;


      console.log(
        "MEPLAY: EARTH READY."
      );


      /*
      --------------------------------------------------------------
      EARTH IS READY.

      This does NOT trigger the timeout warning.

      This does NOT mean the entire MePlay boot is complete.

      The boot completion command is responsible for that.
      --------------------------------------------------------------
      */

      startBoot();

    }
    catch (
      error
    ) {

      /*
      --------------------------------------------------------------
      Earth loading failure is logged only.

      We do not use this as the 1:30 timeout condition.
      --------------------------------------------------------------
      */

      console.error(
        "MEPLAY EARTH LOAD ERROR:",
        error
      );


      createFallbackEarth();


      startBoot();

    }

  }


  /* ================================================================
     FALLBACK EARTH
     ================================================================ */

  function createFallbackEarth() {

    console.warn(
      "MEPLAY: Creating fallback Earth."
    );


    const fallback =
      BABYLON.MeshBuilder.CreateSphere(
        "FallbackEarth",
        {
          diameter: 2.8,
          segments: 64
        },
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "FallbackEarthMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        0.06,
        0.28,
        0.75
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.008,
        0.02,
        0.06
      );


    material.specularColor =
      new BABYLON.Color3(
        0.65,
        0.75,
        1
      );


    material.specularPower =
      64;


    fallback.material =
      material;


    fallback.parent =
      earthRoot;


    fallback.position =
      BABYLON.Vector3.Zero();


    earthRadius =
      1.4;


    earthReady =
      true;

  }


  /* ================================================================
     MP LOGO
     ================================================================ */

  const logoRoot =
    new BABYLON.TransformNode(
      "logoRoot",
      scene
    );


  logoRoot.position =
    new BABYLON.Vector3(
      0,
      0.02,
      1.4
    );


  logoRoot.scaling =
    new BABYLON.Vector3(
      0.001,
      0.001,
      0.001
    );


  /* ================================================================
     M
     ================================================================ */

  function createM() {

    const root =
      new BABYLON.TransformNode(
        "M",
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "MMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        1,
        0.72,
        0.03
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.18,
        0.07,
        0.005
      );


    const pieces = [

      {
        x: -0.38,
        y: 0,
        w: 0.20,
        h: 0.72,
        r: -0.16
      },

      {
        x: 0.38,
        y: 0,
        w: 0.20,
        h: 0.72,
        r: 0.16
      },

      {
        x: -0.10,
        y: 0.18,
        w: 0.18,
        h: 0.48,
        r: 0.58
      },

      {
        x: 0.10,
        y: 0.18,
        w: 0.18,
        h: 0.48,
        r: -0.58
      }

    ];


    pieces.forEach(
      (piece, index) => {

        const box =
          BABYLON.MeshBuilder.CreateBox(
            "M" + index,
            {
              width: piece.w,
              height: piece.h,
              depth: 0.16
            },
            scene
          );


        box.material =
          material;


        box.position.set(
          piece.x,
          piece.y,
          0
        );


        box.rotation.z =
          piece.r;


        box.parent =
          root;


        box.renderingGroupId =
          4;

      }
    );


    return root;

  }


  /* ================================================================
     P
     ================================================================ */

  function createP() {

    const root =
      new BABYLON.TransformNode(
        "P",
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "PMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        0.03,
        0.55,
        1
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.005,
        0.08,
        0.2
      );


    const stem =
      BABYLON.MeshBuilder.CreateBox(
        "PStem",
        {
          width: 0.20,
          height: 1.35,
          depth: 0.17
        },
        scene
      );


    stem.material =
      material;


    stem.position.x =
      -0.30;


    stem.parent =
      root;


    stem.renderingGroupId =
      4;


    const top =
      BABYLON.MeshBuilder.CreateTorus(
        "PTop",
        {
          diameter: 0.60,
          thickness: 0.18,
          tessellation: 32
        },
        scene
      );


    top.material =
      material;


    top.rotation.x =
      Math.PI / 2;


    top.position.set(
      -0.02,
      0.31,
      0
    );


    top.parent =
      root;


    top.renderingGroupId =
      4;


    const cut =
      BABYLON.MeshBuilder.CreateBox(
        "PCut",
        {
          width: 0.35,
          height: 0.32,
          depth: 0.30
        },
        scene
      );


    cut.material =
      material;


    cut.position.set(
      0.05,
      0.05,
      0
    );


    cut.parent =
      root;


    cut.renderingGroupId =
      4;


    return root;

  }


  const M =
    createM();

  const P =
    createP();


  M.parent =
    logoRoot;

  P.parent =
    logoRoot;


  M.position.x =
    -0.53;

  P.position.x =
    0.53;


  /* ================================================================
     LOGO RING
     ================================================================ */

  const logoRing =
    BABYLON.MeshBuilder.CreateTorus(
      "logoRing",
      {
        diameter: 2.25,
        thickness: 0.035,
        tessellation: 96
      },
      scene
    );


  const ringMaterial =
    new BABYLON.StandardMaterial(
      "ringMaterial",
      scene
    );


  ringMaterial.diffuseColor =
    new BABYLON.Color3(
      0.4,
      0.1,
      0.8
    );


  ringMaterial.emissiveColor =
    new BABYLON.Color3(
      0.55,
      0.2,
      1
    );


  ringMaterial.alpha =
    0.65;


  logoRing.material =
    ringMaterial;


  logoRing.parent =
    logoRoot;


  logoRing.rotation.x =
    Math.PI / 2;


  logoRing.position.z =
    -0.03;


  logoRing.renderingGroupId =
    4;


  /* ================================================================
     MAGIC PARTICLES
     ================================================================ */

  const magicCount =
    300;


  const magicPositions =
    [];


  for (
    let i = 0;
    i < magicCount;
    i++
  ) {

    const radius =
      1.5 +
      Math.random() * 3;


    const angle =
      Math.random() *
      Math.PI *
      2;


    magicPositions.push(

      Math.cos(angle) *
      radius,

      (Math.random() - 0.5) *
      3,

      Math.sin(angle) *
      radius

    );

  }


  const magicMesh =
    new BABYLON.Mesh(
      "magic",
      scene
    );


  const magicData =
    new BABYLON.VertexData();


  magicData.positions =
    magicPositions;


  magicData.applyToMesh(
    magicMesh,
    true
  );


  const magicMaterial =
    new BABYLON.StandardMaterial(
      "magicMaterial",
      scene
    );


  magicMaterial.pointsCloud =
    true;

  magicMaterial.pointSize =
    3;

  magicMaterial.disableLighting =
    true;

  magicMaterial.emissiveColor =
    new BABYLON.Color3(
      0.7,
      0.25,
      1
    );

  magicMaterial.alpha =
    0;


  magicMesh.material =
    magicMaterial;


  magicMesh.renderingGroupId =
    5;


  /* ================================================================
     EASING
     ================================================================ */

  function clamp01(value) {

    return Math.max(
      0,
      Math.min(
        1,
        value
      )
    );

  }


  function lerp(
    a,
    b,
    t
  ) {

    return a +
      (b - a) *
      t;

  }


  function easeOutCubic(t) {

    t =
      clamp01(t);

    return 1 -
      Math.pow(
        1 - t,
        3
      );

  }


  function easeInOutCubic(t) {

    t =
      clamp01(t);

    return t < 0.5

      ? 4 *
        t *
        t *
        t

      : 1 -
        Math.pow(
          -2 * t + 2,
          3
        ) / 2;

  }


  function smoothstep(t) {

    t =
      clamp01(t);

    return t *
      t *
      (3 - 2 * t);

  }


  /* ================================================================
     BOOT STATE
     ================================================================ */

  let started =
    false;

  let finished =
    false;

  let bootCompletionReceived =
    false;

  let finalTransitionStarted =
    false;

  let startTime =
    0;

  let warningShown =
    false;


  /* ================================================================
     LOADING UI
     ================================================================ */

  function setLoading(
    percent,
    text
  ) {

    percent =
      Math.max(
        0,
        Math.min(
          100,
          percent
        )
      );


    loadingBar.style.width =
      percent + "%";


    loadingPercent.textContent =
      Math.round(percent) + "%";


    if (
      text
    ) {

      loadingText.textContent =
        text;

    }

  }


  /* ================================================================
     BOOT COMPLETION COMMAND
     ================================================================

     The MePlay kernel / island system can send the completion
     command using postMessage.

     Accepted forms include:

       meplay.boot.animation.command(loading-complete:"true")

     or an object containing:

       command:
       type:
       event:

     with the same command string.

     This command is NOT related to Earth loading.

     It tells the boot animation:

       "The MePlay Island is ready.
        Begin the final zoom and white transition."
     ================================================================ */

  function receiveBootCommand(
    command
  ) {

    if (
      typeof command !== "string"
    ) {

      return;

    }


    const normalized =
      command
        .trim()
        .toLowerCase();


    if (
      normalized ===
      'meplay.boot.animation.command(loading-complete:"true")'
    ) {

      if (
        bootCompletionReceived
      ) {

        return;

      }


      bootCompletionReceived =
        true;


      console.log(
        "MEPLAY: Boot completion command received."
      );


      setLoading(
        100,
        "Loading complete"
      );


      /*
      Give the UI a tiny moment to show 100%
      before beginning the final transition.
      */

      setTimeout(
        () => {

          beginFinalTransition();

        },
        350
      );

    }

  }


  /* ================================================================
     POSTMESSAGE COMMAND LISTENER
     ================================================================ */

  window.addEventListener(
    "message",
    event => {

      const data =
        event.data;


      if (
        typeof data === "string"
      ) {

        receiveBootCommand(
          data
        );

        return;

      }


      if (
        data &&
        typeof data === "object"
      ) {

        if (
          typeof data.command === "string"
        ) {

          receiveBootCommand(
            data.command
          );

        }


        if (
          typeof data.type === "string"
        ) {

          receiveBootCommand(
            data.type
          );

        }


        if (
          typeof data.event === "string"
        ) {

          receiveBootCommand(
            data.event
          );

        }

      }

    }
  );


  /* ================================================================
     CUSTOM EVENT COMMAND LISTENER
     ================================================================ */

  window.addEventListener(
    "meplay.boot.animation.command",
    event => {

      if (
        event.detail &&
        typeof event.detail === "object" &&
        typeof event.detail.command === "string"
      ) {

        receiveBootCommand(
          event.detail.command
        );

      }
      else if (
        typeof event.detail === "string"
      ) {

        receiveBootCommand(
          event.detail
        );

      }

    }
  );


  /* ================================================================
     1:30 TIMEOUT WARNING
     ================================================================

     IMPORTANT:

     This timer is ONLY checking whether the boot completion
     command has arrived.

     It does NOT check:

       • Earth loading
       • GLB loading
       • Babylon loading
       • graphics
       • internet connection

     The Earth can already be fully loaded and this warning
     can still appear if the kernel has not sent the completion
     command.
     ================================================================ */

  function startTimeoutTimer() {

    setTimeout(
      () => {

        if (
          bootCompletionReceived ||
          warningShown ||
          finished
        ) {

          return;

        }


        warningShown =
          true;


        timeoutWarning.classList.add(
          "show"
        );


        console.warn(
          "MEPLAY: Boot completion command has not been received after 90 seconds."
        );

      },
      90000
    );

  }


  /* ================================================================
     START BOOT
     ================================================================ */

  function startBoot() {

    if (
      started
    ) {

      return;

    }


    if (
      !earthReady
    ) {

      return;

    }


    started =
      true;


    finished =
      false;


    startTime =
      performance.now();


    camera.position.set(
      0,
      0.25,
      8
    );


    camera.setTarget(
      BABYLON.Vector3.Zero()
    );


    earthRoot.scaling =
      new BABYLON.Vector3(
        0.001,
        0.001,
        0.001
      );


    setLoading(
      0,
      "Initializing MePlay"
    );


    startTimeoutTimer();

  }


  /* ================================================================
     FINAL TRANSITION
     ================================================================ */

  function beginFinalTransition() {

    if (
      finalTransitionStarted ||
      finished
    ) {

      return;

    }


    finalTransitionStarted =
      true;


    loadingUI.classList.add(
      "hidden"
    );


    status.classList.add(
      "show"
    );


    console.log(
      "MEPLAY: Beginning final world-entry transition."
    );

  }


  /* ================================================================
     BOOT UPDATE
     ================================================================ */

  function updateBoot(
    now
  ) {

    if (
      !started ||
      finished
    ) {

      return;

    }


    const elapsed =
      now -
      startTime;


    /* ============================================================
       EARTH APPEARS
       ============================================================ */

    if (
      elapsed < 1000
    ) {

      const t =
        clamp01(
          elapsed /
          1000
        );


      const e =
        easeOutCubic(t);


      const scale =
        lerp(
          0.001,
          1,
          e
        );


      earthRoot.scaling.setAll(
        scale
      );


      setLoading(
        lerp(
          5,
          18,
          t
        ),
        "Initializing MePlay"
      );

    }


    /* ============================================================
       EARTH ROTATION
       ============================================================ */

    if (
      elapsed > 700
    ) {

      earthRoot.rotation.y +=
        0.00028;

    }


    /* ============================================================
       LOGO RISE
       ============================================================ */

    if (
      elapsed >= 1000 &&
      elapsed < 3900
    ) {

      setLoading(
        lerp(
          18,
          62,
          clamp01(
            (elapsed - 1000) /
            2900
          )
        ),
        "Preparing world"
      );

    }


    if (
      elapsed >= 3900 &&
      elapsed < 4800
    ) {

      const t =
        clamp01(
          (elapsed - 3900) /
          900
        );


      const e =
        easeOutCubic(t);


      logoRoot.scaling.setAll(
        lerp(
          0.001,
          1,
          e
        )
      );


      logoRoot.position.y =
        0.02 +
        Math.sin(
          e * Math.PI
        ) *
        0.08;


      logoRoot.rotation.z =
        (1 - e) *
        -0.08;


      setLoading(
        lerp(
          62,
          76,
          t
        ),
        "Synchronizing MePlay"
      );

    }


    /* ============================================================
       LOGO SETTLE
       ============================================================ */

    if (
      elapsed >= 4800 &&
      elapsed < 5800
    ) {

      const t =
        clamp01(
          (elapsed - 4800) /
          1000
        );


      const pulse =
        1 +
        Math.sin(
          t *
          Math.PI *
          2
        ) *
        0.025;


      logoRoot.scaling.set(
        pulse,
        pulse,
        pulse
      );


      magicMaterial.alpha =
        0.42 *
        Math.sin(
          t *
          Math.PI
        );


      setLoading(
        lerp(
          76,
          88,
          t
        ),
        "Preparing MePlay Island"
      );

    }


    /* ============================================================
       WAITING FOR KERNEL COMMAND
       ============================================================ */

    if (
      elapsed >= 5800 &&
      !finalTransitionStarted
    ) {

      /*
      Keep the bar below 100%.

      The command is what completes the boot.
      */

      setLoading(
        92,
        "Waiting for MePlay Island"
      );

    }


    /* ============================================================
       FINAL ZOOM

       THIS ONLY RUNS AFTER:

       meplay.boot.animation.command(loading-complete:"true")
       ============================================================ */

    if (
      finalTransitionStarted
    ) {

      const transitionElapsed =
        now -
        (
          startTime +
          5800
        );


      const t =
        clamp01(
          transitionElapsed /
          2200
        );


      const e =
        easeInOutCubic(t);


      /*
      ------------------------------------------------------------
      LOGO FADES AWAY
      ------------------------------------------------------------
      */

      const logoFade =
        1 -
        smoothstep(
          clamp01(
            (t - 0.2) /
            0.5
          )
        );


      logoRoot.scaling.setAll(
        Math.max(
          0.001,
          logoFade
        )
      );


      /*
      ------------------------------------------------------------
      CAMERA ZOOM
      ------------------------------------------------------------
      */

      const startDistance =
        Math.max(
          earthRadius * 4.8,
          7
        );


      const endDistance =
        Math.max(
          earthRadius * 1.35,
          1.9
        );


      camera.position.z =
        lerp(
          startDistance,
          endDistance,
          e
        );


      camera.position.y =
        lerp(
          0.25,
          0.03,
          e
        );


      camera.setTarget(
        BABYLON.Vector3.Zero()
      );


      /*
      ------------------------------------------------------------
      STATUS
      ------------------------------------------------------------
      */

      if (
        t > 0.15
      ) {

        status.textContent =
          "Entering MePlay";

        status.classList.add(
          "show"
        );

      }


      /*
      ------------------------------------------------------------
      LOADING UI
      ------------------------------------------------------------
      */

      setLoading(
        100,
        "Loading complete"
      );


      /*
      ------------------------------------------------------------
      WHITE TRANSITION
      ------------------------------------------------------------
      */

      if (
        t > 0.9
      ) {

        flash.style.opacity =
          String(
            smoothstep(
              (t - 0.9) /
              0.1
            )
          );

      }


      /*
      ------------------------------------------------------------
      DONE
      ------------------------------------------------------------
      */

      if (
        t >= 1
      ) {

        finish();

      }

    }


    /* ============================================================
       COSMIC MOTION
       ============================================================ */

    stars.rotation.y +=
      0.00016;

    stars.rotation.x +=
      0.000025;

    magicMesh.rotation.y +=
      0.001;

    magicMesh.rotation.z +=
      0.0015;

  }


  /* ================================================================
     FINISH
     ================================================================ */

  function finish() {

    if (
      finished
    ) {

      return;

    }


    finished =
      true;


    loadingUI.classList.add(
      "hidden"
    );


    status.textContent =
      "MePlay";


    status.classList.add(
      "show"
    );


    setTimeout(
      () => {

        flash.style.opacity =
          "0";


        status.classList.remove(
          "show"
        );

      },
      500
    );


    console.log(
      "MEPLAY: Boot animation finished."
    );

  }


  /* ================================================================
     RESIZE
     ================================================================ */

  function resize() {

    engine.resize();

  }


  window.addEventListener(
    "resize",
    resize
  );


  window.addEventListener(
    "orientationchange",
    resize
  );


  /* ================================================================
     RENDER LOOP
     ================================================================ */

  engine.runRenderLoop(
    () => {

      const now =
        performance.now();


      updateBoot(
        now
      );


      scene.render();

    }
  );


  /* ================================================================
     START
     ================================================================ */

  resize();

  loadEarth();


})();
</script>
