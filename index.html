<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>MePlay — Cosmic Boot</title>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020414;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);

      z-index: 20;

      color: rgba(255,255,255,.9);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;

      opacity: 0;
      transition: opacity .45s ease;

      pointer-events: none;

      text-shadow:
        0 0 10px rgba(120,160,255,.9),
        0 0 30px rgba(90,100,255,.5);
    }

    #status.show {
      opacity: 1;
    }

    #flash {
      position: fixed;
      inset: 0;

      z-index: 30;

      background: white;

      opacity: 0;

      pointer-events: none;
    }

    #loading {
      position: fixed;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      color: rgba(255,255,255,.72);

      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;

      pointer-events: none;

      transition: opacity .5s ease;
    }

    #loading.hidden {
      opacity: 0;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="loading">
  Loading MePlay
</div>

<div id="status">
  Entering MePlay
</div>

<div id="flash"></div>


<script>
(() => {

  "use strict";


  /*
  ============================================================
  MEPLAY COSMIC BOOT
  ============================================================

  Local model:

      ./earth-cartoon.glb

  Put the GLB beside this HTML file.

  No Three.js.
  No GitHub model fetch.
  No Drive.
  No buttons.

  ============================================================
  */


  /* ==========================================================
     DOM
     ========================================================== */

  const canvas =
    document.getElementById("canvas");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const flash =
    document.getElementById("flash");


  /* ==========================================================
     ENGINE
     ========================================================== */

  const engine =
    new BABYLON.Engine(
      canvas,
      true,
      {
        antialias: true,
        preserveDrawingBuffer: true,
        stencil: true
      },
      true
    );


  /* ==========================================================
     SCENE
     ========================================================== */

  const scene =
    new BABYLON.Scene(engine);


  scene.clearColor =
    new BABYLON.Color4(
      0.002,
      0.004,
      0.025,
      1
    );


  /* ==========================================================
     CAMERA
     ========================================================== */

  const camera =
    new BABYLON.UniversalCamera(
      "camera",
      new BABYLON.Vector3(
        0,
        0,
        12
      ),
      scene
    );


  camera.fov =
    0.72;


  camera.minZ =
    0.05;


  camera.maxZ =
    5000;


  camera.setTarget(
    new BABYLON.Vector3(
      0,
      0,
      0
    )
  );


  /* ==========================================================
     LIGHTING
     ========================================================== */

  const sun =
    new BABYLON.DirectionalLight(
      "sun",
      new BABYLON.Vector3(
        -0.5,
        -0.7,
        -1
      ),
      scene
    );


  sun.intensity =
    1.45;


  sun.diffuse =
    new BABYLON.Color3(
      1,
      0.96,
      0.86
    );


  const hemi =
    new BABYLON.HemisphericLight(
      "hemi",
      new BABYLON.Vector3(
        0.2,
        1,
        0.3
      ),
      scene
    );


  hemi.intensity =
    0.55;


  hemi.diffuse =
    new BABYLON.Color3(
      0.65,
      0.78,
      1
    );


  hemi.groundColor =
    new BABYLON.Color3(
      0.025,
      0.035,
      0.09
    );


  const rim =
    new BABYLON.PointLight(
      "rim",
      new BABYLON.Vector3(
        -5,
        3,
        6
      ),
      scene
    );


  rim.intensity =
    20;


  rim.diffuse =
    new BABYLON.Color3(
      0.22,
      0.4,
      1
    );


  /* ==========================================================
     STARS
     ========================================================== */

  const starCount =
    1800;

  const positions =
    [];

  const colors =
    [];


  for (
    let i = 0;
    i < starCount;
    i++
  ) {

    const radius =
      35 +
      Math.random() * 130;

    const theta =
      Math.random() *
      Math.PI *
      2;

    const phi =
      Math.acos(
        2 * Math.random() - 1
      );


    positions.push(

      radius *
      Math.sin(phi) *
      Math.cos(theta),

      radius *
      Math.cos(phi),

      radius *
      Math.sin(phi) *
      Math.sin(theta)

    );


    const tint =
      Math.random();


    if (tint < 0.2) {

      colors.push(
        0.55,
        0.72,
        1
      );

    }
    else if (tint < 0.38) {

      colors.push(
        0.85,
        0.62,
        1
      );

    }
    else {

      colors.push(
        1,
        0.97,
        1
      );

    }

  }


  const stars =
    new BABYLON.Mesh(
      "stars",
      scene
    );


  const starData =
    new BABYLON.VertexData();


  starData.positions =
    positions;

  starData.colors =
    colors;


  starData.applyToMesh(
    stars,
    true
  );


  const starMaterial =
    new BABYLON.StandardMaterial(
      "starMaterial",
      scene
    );


  starMaterial.pointsCloud =
    true;


  starMaterial.pointSize =
    2;


  starMaterial.disableLighting =
    true;


  starMaterial.emissiveColor =
    new BABYLON.Color3(
      1,
      1,
      1
    );


  starMaterial.alpha =
    0.9;


  stars.material =
    starMaterial;


  /* ==========================================================
     EARTH ROOT
     ========================================================== */

  const earthRoot =
    new BABYLON.TransformNode(
      "EarthRoot",
      scene
    );


  earthRoot.position =
    new BABYLON.Vector3(
      0,
      0,
      0
    );


  earthRoot.scaling =
    new BABYLON.Vector3(
      0.001,
      0.001,
      0.001
    );


  let earthContainer =
    null;


  let earthMeshes =
    [];


  let earthRadius =
    1.35;


  let earthReady =
    false;


  /* ==========================================================
     LOAD LOCAL GLB
     ========================================================== */

  async function loadEarth() {

    console.log(
      "MEPLAY: Loading local earth-cartoon.glb..."
    );


    try {

      earthContainer =
        await BABYLON.SceneLoader
          .LoadAssetContainerAsync(
            "./",
            "earth-cartoon.glb",
            scene
          );


      console.log(
        "MEPLAY: GLB loaded successfully."
      );


      /*
      ----------------------------------------------------------
      ADD THE COMPLETE CONTAINER
      ----------------------------------------------------------
      */

      earthContainer.addAllToScene();


      /*
      ----------------------------------------------------------
      GET ROOT NODES
      ----------------------------------------------------------
      */

      const rootNodes =
        earthContainer.rootNodes || [];


      /*
      ----------------------------------------------------------
      PARENT ROOT NODES TO OUR EARTH ROOT
      ----------------------------------------------------------
      */

      rootNodes.forEach(
        node => {

          if (
            node &&
            node !== earthRoot
          ) {

            node.parent =
              earthRoot;

          }

        }
      );


      /*
      ----------------------------------------------------------
      FIND ALL ACTUAL MESHES
      ----------------------------------------------------------
      */

      earthMeshes =
        scene.meshes.filter(
          mesh =>
            mesh !== stars &&
            mesh.isEnabled()
        );


      /*
      ----------------------------------------------------------
      IF GLB HAS MESHES, CENTER USING WORLD BOUNDS
      ----------------------------------------------------------
      */

      if (
        earthMeshes.length > 0
      ) {

        earthMeshes.forEach(
          mesh => {

            mesh.computeWorldMatrix(
              true
            );

          }
        );


        let min =
          new BABYLON.Vector3(
            Infinity,
            Infinity,
            Infinity
          );


        let max =
          new BABYLON.Vector3(
            -Infinity,
            -Infinity,
            -Infinity
          );


        earthMeshes.forEach(
          mesh => {

            const info =
              mesh.getBoundingInfo();


            if (!info) {
              return;
            }


            const box =
              info.boundingBox;


            min =
              BABYLON.Vector3.Minimize(
                min,
                box.minimumWorld
              );


            max =
              BABYLON.Vector3.Maximize(
                max,
                box.maximumWorld
              );

          }
        );


        /*
        --------------------------------------------------------
        MODEL CENTER
        --------------------------------------------------------
        */

        const center =
          min.add(max)
            .scale(0.5);


        /*
        --------------------------------------------------------
        MOVE THE ROOT INSTEAD OF INDIVIDUAL MESHES
        --------------------------------------------------------
        */

        earthRoot.position =
          center.scale(-1);


        /*
        --------------------------------------------------------
        MODEL SIZE
        --------------------------------------------------------
        */

        const size =
          max.subtract(min);


        const largest =
          Math.max(
            size.x,
            size.y,
            size.z
          );


        /*
        --------------------------------------------------------
        TARGET EARTH DIAMETER
        --------------------------------------------------------
        */

        const targetDiameter =
          2.8;


        if (
          largest > 0 &&
          Number.isFinite(largest)
        ) {

          const scale =
            targetDiameter /
            largest;


          earthRoot.scaling =
            new BABYLON.Vector3(
              scale,
              scale,
              scale
            );


          earthRadius =
            targetDiameter / 2;

        }


        /*
        --------------------------------------------------------
        IMPORTANT:

        The root is now centered around the actual model.
        We do NOT move the individual GLB meshes.

        This prevents the "inside the Earth" problem.
        --------------------------------------------------------
        */

        earthReady =
          true;


        console.log(
          "MEPLAY: Earth is ready.",
          {
            meshes: earthMeshes.length,
            radius: earthRadius
          }
        );


        loading.classList.add(
          "hidden"
        );


        startBoot();

      }

      else {

        throw new Error(
          "The GLB loaded but contains no meshes."
        );

      }

    }

    catch (error) {

      console.error(
        "MEPLAY EARTH LOAD ERROR:",
        error
      );


      /*
      ----------------------------------------------------------
      NO FALSE POPUP.

      Instead, leave a console message.

      The cosmic boot can still run with the loading
      indicator removed.
      ----------------------------------------------------------
      */

      loading.textContent =
        "MePlay";


      loading.classList.add(
        "hidden"
      );


      /*
      ----------------------------------------------------------
      FALLBACK EARTH

      This only appears if the local GLB genuinely fails.
      ----------------------------------------------------------
      */

      createFallbackEarth();

      startBoot();

    }

  }


  /* ==========================================================
     FALLBACK EARTH
     ========================================================== */

  function createFallbackEarth() {

    console.warn(
      "MEPLAY: Using fallback Earth."
    );


    const earth =
      BABYLON.MeshBuilder.CreateSphere(
        "FallbackEarth",
        {
          diameter: 2.8,
          segments: 64
        },
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "FallbackEarthMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        0.08,
        0.32,
        0.8
      );


    material.specularColor =
      new BABYLON.Color3(
        0.7,
        0.8,
        1
      );


    material.specularPower =
      64;


    material.emissiveColor =
      new BABYLON.Color3(
        0.01,
        0.025,
        0.08
      );


    earth.material =
      material;


    earth.parent =
      earthRoot;


    earthRadius =
      1.4;


    earthReady =
      true;

  }


  /* ==========================================================
     PURPLE GOO
     ========================================================== */

  const gooMaterial =
    new BABYLON.StandardMaterial(
      "gooMaterial",
      scene
    );


  gooMaterial.diffuseColor =
    new BABYLON.Color3(
      0.46,
      0.08,
      0.85
    );


  gooMaterial.emissiveColor =
    new BABYLON.Color3(
      0.12,
      0.015,
      0.25
    );


  gooMaterial.specularColor =
    new BABYLON.Color3(
      0.95,
      0.75,
      1
    );


  gooMaterial.specularPower =
    96;


  const glob =
    BABYLON.MeshBuilder.CreateSphere(
      "gooGlob",
      {
        diameter: 1,
        segments: 32
      },
      scene
    );


  glob.material =
    gooMaterial;


  glob.scaling =
    new BABYLON.Vector3(
      0.72,
      0.82,
      0.66
    );


  glob.setEnabled(
    false
  );


  /*
  Make sure the goo is ALWAYS rendered
  in front of the Earth.
  */

  glob.renderingGroupId =
    3;


  /* ==========================================================
     GOO SPLAT
     ========================================================== */

  const splat =
    BABYLON.MeshBuilder.CreateSphere(
      "gooSplat",
      {
        diameter: 1,
        segments: 48
      },
      scene
    );


  splat.material =
    gooMaterial;


  splat.scaling =
    new BABYLON.Vector3(
      1,
      0.16,
      0.74
    );


  splat.position =
    new BABYLON.Vector3(
      0,
      1.25,
      1.05
    );


  splat.setEnabled(
    false
  );


  splat.renderingGroupId =
    3;


  /* ==========================================================
     MP LOGO
     ========================================================== */

  const logoRoot =
    new BABYLON.TransformNode(
      "logoRoot",
      scene
    );


  logoRoot.position =
    new BABYLON.Vector3(
      0,
      0.02,
      1.4
    );


  logoRoot.scaling =
    new BABYLON.Vector3(
      0.001,
      0.001,
      0.001
    );


  /*
  ----------------------------------------------------------
  M
  ----------------------------------------------------------
  */

  function createM() {

    const root =
      new BABYLON.TransformNode(
        "M",
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "MMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        1,
        0.72,
        0.03
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.18,
        0.07,
        0.005
      );


    const pieces = [

      [-0.38, 0, 0.20, 0.72, -0.16],

      [ 0.38, 0, 0.20, 0.72,  0.16],

      [-0.10, 0.18, 0.18, 0.48, 0.58],

      [ 0.10, 0.18, 0.18, 0.48, -0.58]

    ];


    pieces.forEach(
      (p, i) => {

        const box =
          BABYLON.MeshBuilder.CreateBox(
            "M" + i,
            {
              width: p[2],
              height: p[3],
              depth: 0.16
            },
            scene
          );


        box.material =
          material;


        box.position.set(
          p[0],
          p[1],
          0
        );


        box.rotation.z =
          p[4];


        box.parent =
          root;


        box.renderingGroupId =
          4;

      }
    );


    return root;

  }


  /*
  ----------------------------------------------------------
  P
  ----------------------------------------------------------
  */

  function createP() {

    const root =
      new BABYLON.TransformNode(
        "P",
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "PMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        0.03,
        0.55,
        1
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.005,
        0.08,
        0.2
      );


    const stem =
      BABYLON.MeshBuilder.CreateBox(
        "PStem",
        {
          width: 0.20,
          height: 1.35,
          depth: 0.17
        },
        scene
      );


    stem.material =
      material;


    stem.position.x =
      -0.30;


    stem.parent =
      root;


    const top =
      BABYLON.MeshBuilder.CreateTorus(
        "PTop",
        {
          diameter: 0.60,
          thickness: 0.18,
          tessellation: 32
        },
        scene
      );


    top.material =
      material;


    top.rotation.x =
      Math.PI / 2;


    top.position.set(
      -0.02,
      0.31,
      0
    );


    top.parent =
      root;


    const cut =
      BABYLON.MeshBuilder.CreateBox(
        "PCut",
        {
          width: 0.35,
          height: 0.32,
          depth: 0.30
        },
        scene
      );


    cut.material =
      material;


    cut.position.set(
      0.05,
      0.05,
      0
    );


    cut.parent =
      root;


    return root;

  }


  const M =
    createM();


  const P =
    createP();


  M.parent =
    logoRoot;


  P.parent =
    logoRoot;


  M.position.x =
    -0.53;


  P.position.x =
    0.53;


  /* ==========================================================
     LOGO RING
     ========================================================== */

  const logoRing =
    BABYLON.MeshBuilder.CreateTorus(
      "logoRing",
      {
        diameter: 2.25,
        thickness: 0.035,
        tessellation: 96
      },
      scene
    );


  const ringMaterial =
    new BABYLON.StandardMaterial(
      "ringMaterial",
      scene
    );


  ringMaterial.diffuseColor =
    new BABYLON.Color3(
      0.4,
      0.1,
      0.8
    );


  ringMaterial.emissiveColor =
    new BABYLON.Color3(
      0.55,
      0.2,
      1
    );


  ringMaterial.alpha =
    0.65;


  logoRing.material =
    ringMaterial;


  logoRing.parent =
    logoRoot;


  logoRing.rotation.x =
    Math.PI / 2;


  logoRing.position.z =
    -0.03;


  logoRing.renderingGroupId =
    4;


  /* ==========================================================
     MAGIC PARTICLES
     ========================================================== */

  const magicCount =
    300;


  const magicPositions =
    [];


  for (
    let i = 0;
    i < magicCount;
    i++
  ) {

    const radius =
      1.5 +
      Math.random() * 3;


    const angle =
      Math.random() *
      Math.PI *
      2;


    magicPositions.push(

      Math.cos(angle) * radius,

      (Math.random() - 0.5) * 3,

      Math.sin(angle) * radius

    );

  }


  const magicMesh =
    new BABYLON.Mesh(
      "magic",
      scene
    );


  const magicData =
    new BABYLON.VertexData();


  magicData.positions =
    magicPositions;


  magicData.applyToMesh(
    magicMesh,
    true
  );


  const magicMaterial =
    new BABYLON.StandardMaterial(
      "magicMaterial",
      scene
    );


  magicMaterial.pointsCloud =
    true;


  magicMaterial.pointSize =
    3;


  magicMaterial.disableLighting =
    true;


  magicMaterial.emissiveColor =
    new BABYLON.Color3(
      0.7,
      0.25,
      1
    );


  magicMaterial.alpha =
    0;


  magicMesh.material =
    magicMaterial;


  magicMesh.renderingGroupId =
    5;


  /* ==========================================================
     ANIMATION
     ========================================================== */

  let started =
    false;


  let finished =
    false;


  let startTime =
    0;


  function startBoot() {

    if (
      started
    ) {

      return;

    }


    started =
      true;


    startTime =
      performance.now();


    loading.classList.add(
      "hidden"
    );

  }


  function updateBoot(now) {

    if (
      !started ||
      finished
    ) {

      return;

    }


    const elapsed =
      now - startTime;


    /* ========================================================
       EARTH APPEARS
       ======================================================== */

    if (
      elapsed < 1000
    ) {

      const t =
        clamp01(
          elapsed / 1000
        );


      const e =
        easeOutCubic(t);


      const scale =
        lerp(
          0.001,
          1,
          e
        );


      earthRoot.scaling.setAll(
        scale
      );

    }


    /* ========================================================
       EARTH ROTATES
       ======================================================== */

    if (
      elapsed > 700
    ) {

      earthRoot.rotation.y +=
        0.00028;

    }


    /* ========================================================
       GOO FLIES IN
       ======================================================== */

    if (
      elapsed >= 1000 &&
      elapsed < 2500
    ) {

      glob.setEnabled(
        true
      );


      const t =
        clamp01(
          (elapsed - 1000) /
          1500
        );


      const e =
        easeInCubic(t);


      const one =
        1 - e;


      const sx = -2.8;
      const sy = 5.8;
      const sz = 3.8;

      const cx = -0.9;
      const cy = 3.4;
      const cz = 3.1;

      const ex = 0;
      const ey = 1.28;
      const ez = 1.28;


      glob.position.set(

        one * one * sx +
        2 * one * e * cx +
        e * e * ex,

        one * one * sy +
        2 * one * e * cy +
        e * e * ey,

        one * one * sz +
        2 * one * e * cz +
        e * e * ez

      );


      glob.rotation.x =
        0.4 + t * 1.2;


      glob.rotation.y =
        t * 0.8;


      glob.rotation.z =
        -0.25 + t * 0.7;


      const squash =
        t > 0.82

          ? 1 -
            smoothstep(
              (t - 0.82) /
              0.18
            ) *
            0.48

          : 1;


      glob.scaling.set(

        0.72 *
        (
          1 +
          (1 - squash) *
          0.75
        ),

        0.82 *
        squash,

        0.66 *
        (
          1 +
          (1 - squash) *
          0.25
        )

      );

    }


    /* ========================================================
       IMPACT
       ======================================================== */

    if (
      elapsed >= 2500 &&
      elapsed < 2800
    ) {

      glob.setEnabled(
        true
      );


      const t =
        clamp01(
          (elapsed - 2500) /
          300
        );


      const e =
        easeOutCubic(t);


      glob.position.set(
        0,
        lerp(1.28, 1.20, e),
        lerp(1.28, 1.38, e)
      );


      glob.scaling.set(

        lerp(.92, 1.55, e),

        lerp(.30, .14, e),

        lerp(.82, 1.12, e)

      );

    }


    /* ========================================================
       SPLAT
       ======================================================== */

    if (
      elapsed >= 2700 &&
      elapsed < 3900
    ) {

      glob.setEnabled(
        false
      );


      splat.setEnabled(
        true
      );


      const t =
        clamp01(
          (elapsed - 2700) /
          850
        );


      const e =
        easeOutCubic(t);


      splat.scaling.set(

        lerp(.05, 1.16, e),

        lerp(.025, .18, e),

        lerp(.05, .82, e)

      );


      splat.position.set(
        0,
        lerp(1.38, 1.19, e),
        1.38
      );

    }


    /* ========================================================
       LOGO RISE
       ======================================================== */

    if (
      elapsed >= 3900 &&
      elapsed < 4800
    ) {

      const t =
        clamp01(
          (elapsed - 3900) /
          900
        );


      const e =
        easeOutCubic(t);


      logoRoot.scaling.setAll(
        lerp(
          0.001,
          1,
          e
        )
      );


      logoRoot.position.y =
        0.02 +
        Math.sin(
          e * Math.PI
        ) * 0.08;


      logoRoot.rotation.z =
        (1 - e) * -0.08;

    }


    /* ========================================================
       LOGO SETTLE
       ======================================================== */

    if (
      elapsed >= 4800 &&
      elapsed < 5800
    ) {

      const t =
        clamp01(
          (elapsed - 4800) /
          1000
        );


      const pulse =
        1 +
        Math.sin(
          t * Math.PI * 2
        ) * 0.025;


      logoRoot.scaling.set(
        pulse,
        pulse,
        pulse
      );


      magicMaterial.alpha =
        0.42 *
        Math.sin(
          t * Math.PI
        );

    }


    /* ========================================================
       FINAL WORLD ZOOM
       ======================================================== */

    if (
      elapsed >= 5800
    ) {

      const t =
        clamp01(
          (elapsed - 5800) /
          2200
        );


      const e =
        easeInOutCubic(t);


      /*
      --------------------------------------------------------
      LOGO FADES
      --------------------------------------------------------
      */

      const logoFade =
        1 -
        smoothstep(
          clamp01(
            (t - 0.2) /
            0.5
          )
        );


      logoRoot.scaling.setAll(
        Math.max(
          0.001,
          logoFade
        )
      );


      /*
      --------------------------------------------------------
      CAMERA

      This is deliberately based on the Earth radius.

      We NEVER put the camera inside the sphere.
      --------------------------------------------------------
      */

      const safeOutsideDistance =
        Math.max(
          earthRadius * 2.6,
          3.6
        );


      const finalDistance =
        Math.max(
          earthRadius * 1.18,
          1.65
        );


      camera.position.z =
        lerp(
          safeOutsideDistance,
          finalDistance,
          e
        );


      camera.position.y =
        lerp(
          0.25,
          0.02,
          e
        );


      camera.setTarget(
        BABYLON.Vector3.Zero()
      );


      /*
      --------------------------------------------------------
      STATUS
      --------------------------------------------------------
      */

      if (
        t > 0.72
      ) {

        status.classList.add(
          "show"
        );

      }


      /*
      --------------------------------------------------------
      FLASH
      --------------------------------------------------------
      */

      if (
        t > 0.9
      ) {

        flash.style.opacity =
          String(
            smoothstep(
              (t - 0.9) /
              0.1
            )
          );

      }


      if (
        t >= 1
      ) {

        finish();

      }

    }


    /*
    ----------------------------------------------------------
    COSMIC MOTION
    ----------------------------------------------------------
    */

    stars.rotation.y +=
      0.00016;


    stars.rotation.x +=
      0.000025;


    magicMesh.rotation.y +=
      0.001;


    magicMesh.rotation.z +=
      0.0015;

  }


  /* ==========================================================
     FINISH
     ========================================================== */

  function finish() {

    if (
      finished
    ) {

      return;

    }


    finished =
      true;


    status.textContent =
      "MePlay";


    status.classList.add(
      "show"
    );


    setTimeout(
      () => {

        flash.style.opacity =
          "0";


        status.classList.remove(
          "show"
        );

      },
      500
    );

  }


  /* ==========================================================
     RESIZE
     ========================================================== */

  function resize() {

    engine.resize();

  }


  window.addEventListener(
    "resize",
    resize
  );


  window.addEventListener(
    "orientationchange",
    resize
  );


  /* ==========================================================
     LOOP
     ========================================================== */

  engine.runRenderLoop(
    () => {

      const now =
        performance.now();


      updateBoot(
        now
      );


      scene.render();

    }
  );


  /* ==========================================================
     GO
     ========================================================== */

  resize();

  loadEarth();


})();
</script>

</body>
</html>
