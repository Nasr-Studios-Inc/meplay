<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MePlay — Cosmic Boot Animation</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020414;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading-ui{position:fixed;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,calc(100vw - 44px));z-index:20;pointer-events:none;transition:opacity .6s ease,transform .6s ease}#loading-ui.hidden{opacity:0;transform:translate(-50%,12px)}
#loading-label{display:flex;justify-content:space-between;margin:0 2px 10px;color:rgba(235,247,255,.92);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 14px rgba(100,180,255,.7)}#loading-percent{color:#8cecff;font-variant-numeric:tabular-nums}
#loading-track{position:relative;height:18px;padding:3px;border:1px solid rgba(145,225,255,.28);border-radius:999px;background:rgba(2,8,25,.55);box-shadow:0 0 24px rgba(60,170,255,.12),inset 0 0 18px rgba(90,140,255,.08);overflow:hidden}#loading-track:before{content:"";position:absolute;inset:2px;border-radius:999px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px)}#loading-fill{position:relative;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#65b9ff,#b78cff,#7df4ff);box-shadow:0 0 14px rgba(110,205,255,.75),0 0 34px rgba(130,100,255,.32);transition:width .18s ease-out;overflow:hidden}#loading-fill:after{content:"";position:absolute;top:0;bottom:0;width:80px;right:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:scan 1.2s linear infinite}@keyframes scan{from{transform:translateX(-30px)}to{transform:translateX(110px)}}#loading-dots{display:flex;justify-content:space-between;margin-top:8px;padding:0 5px;color:rgba(180,215,255,.38);font-size:8px;letter-spacing:.18em;text-transform:uppercase}
#status{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;color:rgba(255,255,255,.9);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .45s ease;pointer-events:none;white-space:nowrap;text-shadow:0 0 10px rgba(120,160,255,.9),0 0 30px rgba(90,100,255,.5)}#status.show{opacity:1}#flash{position:fixed;inset:0;z-index:30;background:white;opacity:0;pointer-events:none}
#warning{position:fixed;top:20px;right:20px;z-index:100;width:min(390px,calc(100vw - 40px));padding:17px 18px;border:1px solid rgba(255,210,120,.28);border-radius:15px;background:rgba(12,12,24,.88);backdrop-filter:blur(18px);box-shadow:0 12px 45px rgba(0,0,0,.35),0 0 30px rgba(255,170,80,.08);color:rgba(255,248,232,.94);font-size:12px;line-height:1.55;opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .35s ease,transform .35s ease}#warning.show{opacity:1;transform:translateY(0)}#warning-title{margin-bottom:5px;color:#ffd889;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loading-ui"><div id="loading-label"><span id="loading-text">Initializing MePlay</span><span id="loading-percent">0%</span></div><div id="loading-track"><div id="loading-fill"></div></div><div id="loading-dots"><span>EARTH</span><span>STARS</span><span>KERNEL</span><span>ISLAND</span></div></div>
<div id="status">Entering MePlay</div><div id="flash"></div>
<div id="warning"><div id="warning-title">MePlay Boot Warning</div><div id="warning-message">Its taking longer then usual to load try rebooting to or if problem persits wait extra 1 minuite for error code to appear then contact support</div></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),canvas=$("canvas"),loadingUI=$("loading-ui"),loadingText=$("loading-text"),loadingPercent=$("loading-percent"),loadingFill=$("loading-fill"),status=$("status"),flash=$("flash"),warning=$("warning"),warningTitle=$("warning-title"),warningMessage=$("warning-message");
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:true,stencil:true},true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.002,.004,.025,1);
const camera=new BABYLON.UniversalCamera("camera",new BABYLON.Vector3(0,.25,8),scene);camera.fov=.72;camera.minZ=.05;camera.maxZ=5000;camera.setTarget(BABYLON.Vector3.Zero());
const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-.7,-1),scene);sun.intensity=1.35;sun.diffuse=new BABYLON.Color3(1,.96,.86);
const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(.2,1,.3),scene);hemi.intensity=.6;hemi.diffuse=new BABYLON.Color3(.65,.78,1);hemi.groundColor=new BABYLON.Color3(.025,.035,.09);
const rim=new BABYLON.PointLight("rim",new BABYLON.Vector3(-5,3,6),scene);rim.intensity=18;rim.diffuse=new BABYLON.Color3(.22,.4,1);
const positions=[],colors=[];for(let i=0;i<1800;i++){const r=35+Math.random()*130,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);positions.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));const q=Math.random();q<.2?colors.push(.55,.72,1):q<.38?colors.push(.86,.64,1):colors.push(1,.97,1)}
const stars=new BABYLON.Mesh("stars",scene),sd=new BABYLON.VertexData();sd.positions=positions;sd.colors=colors;sd.applyToMesh(stars,true);const sm=new BABYLON.StandardMaterial("starMaterial",scene);sm.pointsCloud=true;sm.pointSize=2;sm.disableLighting=true;sm.emissiveColor=new BABYLON.Color3(1,1,1);sm.alpha=.9;stars.material=sm;
const earthRoot=new BABYLON.TransformNode("EarthRoot",scene);earthRoot.scaling.setAll(.001);let earthReady=false,earthRadius=1.4;
function setLoading(v,text){v=Math.max(0,Math.min(100,v));loadingFill.style.width=v+"%";loadingPercent.textContent=Math.round(v)+"%";if(text)loadingText.textContent=text}
function clamp(v){return Math.max(0,Math.min(1,v))}function lerp(a,b,t){return a+(b-a)*t}function out(t){t=clamp(t);return 1-Math.pow(1-t,3)}function io(t){t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function smooth(t){t=clamp(t);return t*t*(3-2*t)}
async function loadEarth(){setLoading(8,"Loading Earth");try{const c=await BABYLON.SceneLoader.LoadAssetContainerAsync("./","earth-cartoon.glb",scene);c.addAllToScene();c.rootNodes.slice().forEach(n=>{if(n&&n!==earthRoot)n.parent=earthRoot});const meshes=c.meshes.filter(m=>m&&m.getTotalVertices()>0);if(!meshes.length)throw Error("No renderable Earth meshes");earthRoot.position.setAll(0);earthRoot.rotation.setAll(0);earthRoot.scaling.setAll(1);earthRoot.computeWorldMatrix(true);meshes.forEach(m=>m.computeWorldMatrix(true));let min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);meshes.forEach(m=>{const b=m.getBoundingInfo().boundingBox;min=BABYLON.Vector3.Minimize(min,b.minimumWorld);max=BABYLON.Vector3.Maximize(max,b.maximumWorld)});const d=max.subtract(min),center=min.add(max).scale(.5),largest=Math.max(d.x,d.y,d.z);if(!Number.isFinite(largest)||largest<=0)throw Error("Invalid Earth bounds");earthRoot.position=center.scale(-1);earthRoot.scaling.setAll(2.8/largest);earthRadius=1.4;earthRoot.computeWorldMatrix(true);earthReady=true;setLoading(92,"Waiting for MePlay Kernel");}catch(e){console.error(e);const s=BABYLON.MeshBuilder.CreateSphere("FallbackEarth",{diameter:2.8,segments:64},scene),m=new BABYLON.StandardMaterial("FallbackEarthMaterial",scene);m.diffuseColor=new BABYLON.Color3(.06,.28,.75);m.emissiveColor=new BABYLON.Color3(.008,.02,.06);m.specularColor=new BABYLON.Color3(.65,.75,1);s.material=m;s.parent=earthRoot;earthRadius=1.4;earthReady=true;setLoading(92,"Waiting for MePlay Kernel")}}
let started=false,finished=false,commandReceived=false,startTime=0,waitStart=performance.now(),warningShown=false;
window.meplayBootCommand=function(command){if(typeof command!=="string")return;if(command.trim()==='meplay.boot.animation.command(loading-complete:"true")'){commandReceived=true;window.__meplayBootCompleted=true;if(earthReady&&!started)startBoot()}};
window.addEventListener("meplay:boot-command",e=>{if(e.detail&&typeof e.detail.command==="string")window.meplayBootCommand(e.detail.command)});
function startBoot(){if(started||!earthReady)return;started=true;startTime=performance.now();camera.position.set(0,.25,8);camera.setTarget(BABYLON.Vector3.Zero());earthRoot.scaling.setAll(.001);loadingUI.classList.add("hidden")}
function showWarning(){if(warningShown||commandReceived)return;warningShown=true;warning.classList.add("show");setTimeout(()=>{if(!commandReceived){warningTitle.textContent="MePlay Boot Error";warningMessage.textContent="MePlay could not receive the loading-complete command. Please reboot and contact support with the error code."}},60000)}
setInterval(()=>{if(!commandReceived&&!warningShown&&performance.now()-waitStart>=90000)showWarning()},250);
window.addEventListener("meplay:debug-timeout",showWarning);
function finish(){if(finished)return;finished=true;setLoading(100,"MePlay Island");status.textContent="MePlay";status.classList.add("show");setTimeout(()=>{flash.style.opacity="0";status.classList.remove("show")},500);window.dispatchEvent(new CustomEvent("meplay:island-boot",{detail:{ready:true}}))}
function update(now){if(!started||finished)return;const e=now-startTime;if(e<1000)earthRoot.scaling.setAll(lerp(.001,1,out(e/1000)));else earthRoot.scaling.setAll(1);if(e>700)earthRoot.rotation.y+=.00028;if(e>=1000&&e<4800){setLoading(92,"Waiting for MePlay Kernel")}if(e>=4800){const t=clamp((e-4800)/2200),x=io(t);const a=Math.max(earthRadius*4.8,7),b=Math.max(earthRadius*1.35,1.9);camera.position.z=lerp(a,b,x);camera.position.y=lerp(.25,.03,x);camera.setTarget(BABYLON.Vector3.Zero());setLoading(lerp(92,100,x),"Entering MePlay Island");if(t>.72)status.classList.add("show");if(t>.9)flash.style.opacity=String(smooth((t-.9)/.1));if(t>=1)finish()}stars.rotation.y+=.00016;stars.rotation.x+=.000025}
window.addEventListener("resize",()=>engine.resize());window.addEventListener("orientationchange",()=>engine.resize());engine.runRenderLoop(()=>{update(performance.now());scene.render()});engine.resize();loadEarth();
fetch("./meplay-debug.js").then(r=>{if(!r.ok)throw Error("debug module unavailable");return r.text()}).then(x=>new Function(atob(x.replace(/\s+/g,"")))()).catch(e=>console.warn("MePlay debug module unavailable",e));
})();
</script>
</body>
</html>
