<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>MePlay — Cosmic Boot Animation</title>

  <!-- ============================================================
       BABYLON.JS
       ============================================================ -->

  <script src="https://cdn.babylonjs.com/babylon.js"></script>

  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>


  <style>

    /* ============================================================
       GLOBAL
       ============================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          #08133d 0%,
          #030822 38%,
          #020414 72%,
          #01020b 100%
        );

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /* ============================================================
       CANVAS
       ============================================================ */

    #canvas {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

    }


    /* ============================================================
       LOADING INTERFACE
       ============================================================ */

    #loadingInterface {

      position: fixed;

      left: 50%;
      bottom: 7.5vh;

      transform: translateX(-50%);

      width: min(680px, 82vw);

      z-index: 20;

      text-align: center;

      pointer-events: none;

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;

    }


    #loadingInterface.hidden {

      opacity: 0;

      transform:
        translateX(-50%)
        translateY(25px);

    }


    /* ============================================================
       LOADING TITLE
       ============================================================ */

    #loadingTitle {

      margin-bottom: 18px;

      color:
        rgba(255,255,255,.96);

      font-size:
        clamp(15px, 1.5vw, 20px);

      font-weight: 600;

      letter-spacing:
        .22em;

      text-transform:
        uppercase;

      text-shadow:
        0 0 12px rgba(110,170,255,.8),
        0 0 35px rgba(90,110,255,.45);

    }


    #loadingSubtext {

      margin-top: 15px;

      color:
        rgba(205,220,255,.65);

      font-size:
        clamp(10px, 1vw, 13px);

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

    }


    /* ============================================================
       UNIQUE LOADING BAR
       ============================================================ */

    #loadingTrack {

      position: relative;

      width: 100%;

      height: 32px;

      border-radius: 999px;

      overflow: hidden;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid
        rgba(150,190,255,.25);

      box-shadow:

        inset
        0 0 25px
        rgba(40,80,180,.18),

        0 0 25px
        rgba(70,110,255,.12);

    }


    /*
    The actual loading energy.
    */

    #loadingEnergy {

      position: absolute;

      left: 4px;
      top: 4px;

      width: calc(100% - 8px);
      height: calc(100% - 8px);

      border-radius: 999px;

      overflow: hidden;

    }


    #loadingEnergyCore {

      position: absolute;

      left: -35%;

      top: 0;

      width: 35%;

      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(100,180,255,.12),
          rgba(220,240,255,.95),
          rgba(120,170,255,.8),
          transparent
        );

      filter:
        blur(1px);

      box-shadow:
        0 0 15px rgba(130,190,255,.9),
        0 0 35px rgba(90,130,255,.7);

      animation:
        cosmicTravel
        2.4s
        cubic-bezier(.45,0,.55,1)
        infinite;

    }


    /*
    Secondary moving streak.
    */

    #loadingEnergyTrail {

      position: absolute;

      left: -50%;

      top: 3px;

      width: 50%;

      height: calc(100% - 6px);

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(130,160,255,.08),
          rgba(190,210,255,.4),
          transparent
        );

      animation:
        cosmicTrail
        3.5s
        linear
        infinite;

    }


    @keyframes cosmicTravel {

      0% {

        transform:
          translateX(0);

        opacity:
          .2;

      }

      15% {

        opacity:
          1;

      }

      85% {

        opacity:
          1;

      }

      100% {

        transform:
          translateX(385%);

        opacity:
          .15;

      }

    }


    @keyframes cosmicTrail {

      0% {

        transform:
          translateX(0);

      }

      100% {

        transform:
          translateX(300%);

      }

    }


    /*
    When the command arrives, the loader becomes complete.
    */

    #loadingComplete {

      position: absolute;

      left: 0;

      top: 0;

      width: 0%;

      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          rgba(90,130,255,.65),
          rgba(180,220,255,.95),
          rgba(255,255,255,1)
        );

      box-shadow:
        0 0 15px rgba(130,190,255,.9),
        0 0 35px rgba(90,130,255,.7);

      transition:
        width 1.2s cubic-bezier(.2,.8,.2,1);

    }


    /*
    Tiny stars travel through the loading track.
    */

    .loadingStar {

      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background:
        white;

      box-shadow:
        0 0 6px white,
        0 0 12px rgba(130,180,255,.9);

      opacity: .8;

      animation:
        loadingStarTravel
        var(--duration)
        linear
        infinite;

      animation-delay:
        var(--delay);

    }


    @keyframes loadingStarTravel {

      from {

        transform:
          translateX(-20px);

      }

      to {

        transform:
          translateX(700px);

      }

    }


    /* ============================================================
       LOADING STATUS
       ============================================================ */

    #loadingStatus {

      margin-top: 12px;

      min-height: 20px;

      color:
        rgba(220,230,255,.78);

      font-size:
        11px;

      letter-spacing:
        .18em;

      text-transform:
        uppercase;

    }


    #loadingPercent {

      display: inline-block;

      margin-left: 8px;

      color:
        rgba(255,255,255,.95);

      font-variant-numeric:
        tabular-nums;

    }


    /* ============================================================
       90 SECOND WARNING
       ============================================================ */

    #warning {

      position: fixed;

      top: max(22px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));

      width:
        min(390px, calc(100vw - 44px));

      padding:
        18px 20px;

      z-index: 50;

      border-radius:
        16px;

      background:
        rgba(8,14,38,.88);

      border:
        1px solid
        rgba(150,190,255,.28);

      box-shadow:

        0 12px 50px
        rgba(0,0,0,.4),

        0 0 35px
        rgba(80,120,255,.12),

        inset 0 0 30px
        rgba(70,100,200,.08);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      opacity:
        0;

      transform:
        translateX(30px);

      pointer-events:
        none;

      transition:
        opacity .5s ease,
        transform .5s ease;

    }


    #warning.show {

      opacity:
        1;

      transform:
        translateX(0);

    }


    #warningTitle {

      color:
        white;

      font-size:
        13px;

      font-weight:
        700;

      letter-spacing:
        .12em;

      text-transform:
        uppercase;

      margin-bottom:
        9px;

    }


    #warningText {

      color:
        rgba(225,232,255,.75);

      font-size:
        12px;

      line-height:
        1.6;

    }


    /* ============================================================
       STATUS
       ============================================================ */

    #status {

      position: fixed;

      left: 50%;

      bottom:
        max(22px, env(safe-area-inset-bottom));

      transform:
        translateX(-50%);

      z-index:
        20;

      color:
        rgba(255,255,255,.9);

      font-size:
        12px;

      font-weight:
        500;

      letter-spacing:
        .2em;

      text-transform:
        uppercase;

      opacity:
        0;

      transition:
        opacity .45s ease;

      pointer-events:
        none;

      white-space:
        nowrap;

      text-shadow:
        0 0 10px rgba(120,160,255,.9),
        0 0 30px rgba(90,100,255,.5);

    }


    #status.show {

      opacity:
        1;

    }


    /* ============================================================
       FLASH
       ============================================================ */

    #flash {

      position: fixed;

      inset: 0;

      z-index: 30;

      background:
        white;

      opacity:
        0;

      pointer-events:
        none;

    }

  </style>

</head>


<body>


<canvas id="canvas"></canvas>


<!-- ==============================================================
     LOADING INTERFACE
     ============================================================== -->

<div id="loadingInterface">

  <div id="loadingTitle">
    Preparing MePlay
  </div>


  <div id="loadingTrack">

    <div id="loadingEnergy">

      <div id="loadingEnergyTrail"></div>

      <div id="loadingEnergyCore"></div>

      <div id="loadingComplete"></div>

      <div
        class="loadingStar"
        style="--duration:2.2s;--delay:-.4s"
      ></div>

      <div
        class="loadingStar"
        style="--duration:3.1s;--delay:-1.7s"
      ></div>

      <div
        class="loadingStar"
        style="--duration:2.7s;--delay:-2.3s"
      ></div>

      <div
        class="loadingStar"
        style="--duration:4s;--delay:-3s"
      ></div>

    </div>

  </div>


  <div id="loadingStatus">

    Connecting to your world

    <span id="loadingPercent">
      0%
    </span>

  </div>


  <div id="loadingSubtext">
    Waiting for MePlay Island
  </div>

</div>


<!-- ==============================================================
     90 SECOND WARNING
     ============================================================== -->

<div id="warning">

  <div id="warningTitle">
    MePlay is taking longer than usual
  </div>

  <div id="warningText">
    Try rebooting. If the problem persists, wait another
    1 minute for an error code to appear, then contact support.
  </div>

</div>


<div id="status">
  Entering MePlay
</div>


<div id="flash"></div>


<script>

(() => {

  "use strict";


  /*
  ==================================================================
  MEPLAY COSMIC BOOT
  ==================================================================

  BOOT FLOW:

      1. Earth loads independently.
      2. Earth appears.
      3. Loading interface waits for the MePlay Island system.
      4. The loading animation remains active.
      5. After 90 seconds WITHOUT the completion command,
         the warning appears.
      6. The warning does NOT mean the Earth failed to load.
      7. The warning does NOT start the boot.
      8. The warning does NOT finish the boot.
      9. The ONLY thing that starts the final zoom is:

         meplay.boot.animation.command(loading-complete:"true")

     10. Once that command is received:
         loading becomes 100%
         loading interface disappears
         camera zoom begins
         screen becomes white
         boot animation finishes
         MePlay Island can take over.

  ==================================================================
  */


  /* ================================================================
     DOM
     ================================================================ */

  const canvas =
    document.getElementById("canvas");


  const loadingInterface =
    document.getElementById(
      "loadingInterface"
    );


  const loadingComplete =
    document.getElementById(
      "loadingComplete"
    );


  const loadingPercent =
    document.getElementById(
      "loadingPercent"
    );


  const loadingStatus =
    document.getElementById(
      "loadingStatus"
    );


  const loadingSubtext =
    document.getElementById(
      "loadingSubtext"
    );


  const warning =
    document.getElementById(
      "warning"
    );


  const status =
    document.getElementById(
      "status"
    );


  const flash =
    document.getElementById(
      "flash"
    );


  /* ================================================================
     ENGINE
     ================================================================ */

  const engine =
    new BABYLON.Engine(
      canvas,
      true,
      {
        antialias: true,
        preserveDrawingBuffer: true,
        stencil: true
      },
      true
    );


  /* ================================================================
     SCENE
     ================================================================ */

  const scene =
    new BABYLON.Scene(
      engine
    );


  scene.clearColor =
    new BABYLON.Color4(
      0.002,
      0.004,
      0.025,
      1
    );


  /* ================================================================
     CAMERA
     ================================================================ */

  const camera =
    new BABYLON.UniversalCamera(
      "camera",
      new BABYLON.Vector3(
        0,
        0.25,
        8
      ),
      scene
    );


  camera.fov =
    0.72;


  camera.minZ =
    0.05;


  camera.maxZ =
    5000;


  camera.setTarget(
    BABYLON.Vector3.Zero()
  );


  /* ================================================================
     LIGHTING
     ================================================================ */

  const sun =
    new BABYLON.DirectionalLight(
      "sun",
      new BABYLON.Vector3(
        -0.5,
        -0.7,
        -1
      ),
      scene
    );


  sun.intensity =
    1.35;


  sun.diffuse =
    new BABYLON.Color3(
      1,
      0.96,
      0.86
    );


  const hemi =
    new BABYLON.HemisphericLight(
      "hemi",
      new BABYLON.Vector3(
        0.2,
        1,
        0.3
      ),
      scene
    );


  hemi.intensity =
    0.6;


  hemi.diffuse =
    new BABYLON.Color3(
      0.65,
      0.78,
      1
    );


  hemi.groundColor =
    new BABYLON.Color3(
      0.025,
      0.035,
      0.09
    );


  const rim =
    new BABYLON.PointLight(
      "rim",
      new BABYLON.Vector3(
        -5,
        3,
        6
      ),
      scene
    );


  rim.intensity =
    18;


  rim.diffuse =
    new BABYLON.Color3(
      0.22,
      0.4,
      1
    );


  /* ================================================================
     STAR FIELD
     ================================================================ */

  const STAR_COUNT =
    1800;


  const starPositions =
    [];


  const starColors =
    [];


  for (
    let i = 0;
    i < STAR_COUNT;
    i++
  ) {

    const radius =
      35 +
      Math.random() * 130;


    const theta =
      Math.random() *
      Math.PI *
      2;


    const phi =
      Math.acos(
        2 *
        Math.random() -
        1
      );


    starPositions.push(

      radius *
      Math.sin(phi) *
      Math.cos(theta),

      radius *
      Math.cos(phi),

      radius *
      Math.sin(phi) *
      Math.sin(theta)

    );


    const tint =
      Math.random();


    if (
      tint < 0.2
    ) {

      starColors.push(
        0.55,
        0.72,
        1
      );

    }
    else if (
      tint < 0.38
    ) {

      starColors.push(
        0.86,
        0.64,
        1
      );

    }
    else {

      starColors.push(
        1,
        0.97,
        1
      );

    }

  }


  const stars =
    new BABYLON.Mesh(
      "stars",
      scene
    );


  const starData =
    new BABYLON.VertexData();


  starData.positions =
    starPositions;


  starData.colors =
    starColors;


  starData.applyToMesh(
    stars,
    true
  );


  const starMaterial =
    new BABYLON.StandardMaterial(
      "starMaterial",
      scene
    );


  starMaterial.pointsCloud =
    true;


  starMaterial.pointSize =
    2;


  starMaterial.disableLighting =
    true;


  starMaterial.emissiveColor =
    new BABYLON.Color3(
      1,
      1,
      1
    );


  starMaterial.alpha =
    0.9;


  stars.material =
    starMaterial;


  /* ================================================================
     EARTH ROOT
     ================================================================ */

  const earthRoot =
    new BABYLON.TransformNode(
      "EarthRoot",
      scene
    );


  earthRoot.position =
    BABYLON.Vector3.Zero();


  earthRoot.rotation =
    BABYLON.Vector3.Zero();


  earthRoot.scaling =
    new BABYLON.Vector3(
      0.001,
      0.001,
      0.001
    );


  let earthMeshes =
    [];


  let earthReady =
    false;


  let earthRadius =
    1.4;


  /* ================================================================
     EARTH LOADING
     ================================================================ */

  async function loadEarth() {

    console.log(
      "MEPLAY: Loading local Earth GLB..."
    );


    try {

      const container =
        await BABYLON.SceneLoader.LoadAssetContainerAsync(
          "./",
          "earth-cartoon.glb",
          scene
        );


      console.log(
        "MEPLAY: Earth GLB loaded.",
        container
      );


      container.addAllToScene();


      const importedRoots =
        container.rootNodes.slice();


      importedRoots.forEach(
        node => {

          if (
            node &&
            node !== earthRoot
          ) {

            node.parent =
              earthRoot;

          }

        }
      );


      earthMeshes =
        container.meshes.filter(
          mesh =>
            mesh &&
            mesh !== stars &&
            mesh.getTotalVertices() > 0
        );


      if (
        earthMeshes.length === 0
      ) {

        throw new Error(
          "Earth GLB loaded, but no renderable meshes were found."
        );

      }


      earthRoot.position =
        BABYLON.Vector3.Zero();


      earthRoot.rotation =
        BABYLON.Vector3.Zero();


      earthRoot.scaling =
        BABYLON.Vector3.One();


      earthRoot.computeWorldMatrix(
        true
      );


      earthMeshes.forEach(
        mesh => {

          mesh.computeWorldMatrix(
            true
          );

        }
      );


      let minimum =
        new BABYLON.Vector3(
          Infinity,
          Infinity,
          Infinity
        );


      let maximum =
        new BABYLON.Vector3(
          -Infinity,
          -Infinity,
          -Infinity
        );


      earthMeshes.forEach(
        mesh => {

          const bounding =
            mesh.getBoundingInfo();


          if (
            !bounding
          ) {

            return;

          }


          const box =
            bounding.boundingBox;


          minimum =
            BABYLON.Vector3.Minimize(
              minimum,
              box.minimumWorld
            );


          maximum =
            BABYLON.Vector3.Maximize(
              maximum,
              box.maximumWorld
            );

        }
      );


      const dimensions =
        maximum.subtract(
          minimum
        );


      const center =
        minimum
          .add(maximum)
          .scale(0.5);


      const largestDimension =
        Math.max(
          dimensions.x,
          dimensions.y,
          dimensions.z
        );


      if (
        !Number.isFinite(
          largestDimension
        ) ||
        largestDimension <= 0
      ) {

        throw new Error(
          "Invalid Earth model dimensions."
        );

      }


      earthRoot.position =
        center.scale(-1);


      const targetDiameter =
        2.8;


      const modelScale =
        targetDiameter /
        largestDimension;


      earthRoot.scaling =
        new BABYLON.Vector3(
          modelScale,
          modelScale,
          modelScale
        );


      earthRadius =
        targetDiameter / 2;


      earthRoot.computeWorldMatrix(
        true
      );


      earthMeshes.forEach(
        mesh => {

          mesh.computeWorldMatrix(
            true
          );

        }
      );


      earthReady =
        true;


      console.log(
        "MEPLAY: EARTH READY."
      );


      /*
      --------------------------------------------------------------
      IMPORTANT:

      Earth being ready does NOT complete boot.

      The loading interface continues waiting for the
      MePlay Island/kernel command.
      --------------------------------------------------------------
      */

      beginBootWaiting();


    }
    catch (
      error
    ) {

      console.error(
        "MEPLAY EARTH LOAD ERROR:",
        error
      );


      /*
      --------------------------------------------------------------
      The Earth must still appear so the boot animation can
      continue.

      This fallback is ONLY for the Earth itself.

      It has NOTHING to do with the 90-second warning.
      --------------------------------------------------------------
      */

      createFallbackEarth();


      beginBootWaiting();

    }

  }


  /* ================================================================
     FALLBACK EARTH
     ================================================================ */

  function createFallbackEarth() {

    console.warn(
      "MEPLAY: Creating fallback Earth."
    );


    const fallback =
      BABYLON.MeshBuilder.CreateSphere(
        "FallbackEarth",
        {
          diameter: 2.8,
          segments: 64
        },
        scene
      );


    const material =
      new BABYLON.StandardMaterial(
        "FallbackEarthMaterial",
        scene
      );


    material.diffuseColor =
      new BABYLON.Color3(
        0.06,
        0.28,
        0.75
      );


    material.emissiveColor =
      new BABYLON.Color3(
        0.008,
        0.02,
        0.06
      );


    material.specularColor =
      new BABYLON.Color3(
        0.65,
        0.75,
        1
      );


    material.specularPower =
      64;


    fallback.material =
      material;


    fallback.parent =
      earthRoot;


    fallback.position =
      BABYLON.Vector3.Zero();


    earthRadius =
      1.4;


    earthReady =
      true;

  }


  /* ================================================================
     BOOT STATE
     ================================================================ */

  let bootWaiting =
    false;


  let loadingCompleteReceived =
    false;


  let finished =
    false;


  let startTime =
    0;


  let commandReceivedTime =
    0;


  let warningShown =
    false;


  /*
  This timer is ONLY for the Island/kernel command.
  It does not monitor Earth loading.
  */

  let warningTimer =
    null;


  /* ================================================================
     START WAITING
     ================================================================ */

  function beginBootWaiting() {

    if (
      bootWaiting
    ) {

      return;

    }


    bootWaiting =
      true;


    startTime =
      performance.now();


    /*
    Earth starts tiny and grows into view.
    */

    earthRoot.scaling =
      new BABYLON.Vector3(
        0.001,
        0.001,
        0.001
      );


    /*
    The waiting period starts immediately.
    */

    warningTimer =
      setTimeout(
        () => {

          if (
            !loadingCompleteReceived
          ) {

            showWarning();

          }

        },
        90000
      );

  }


  /* ================================================================
     WARNING
     ================================================================ */

  function showWarning() {

    if (
      warningShown ||
      loadingCompleteReceived
    ) {

      return;

    }


    warningShown =
      true;


    warning.classList.add(
      "show"
    );


    console.warn(
      "MEPLAY: Island loading command has not arrived after 90 seconds."
    );

  }


  /* ================================================================
     COMPLETION COMMAND
     ================================================================ */

  function receiveBootCommand(
    command
  ) {

    console.log(
      "MEPLAY BOOT COMMAND:",
      command
    );


    /*
    --------------------------------------------------------------
    Accept the exact command:

      meplay.boot.animation.command(loading-complete:"true")
    --------------------------------------------------------------
    */

    const normalized =
      String(
        command
      )
      .replace(
        /\s+/g,
        ""
      );


    if (
      normalized ===
      'meplay.boot.animation.command(loading-complete:"true")'
    ) {

      completeLoading();

      return true;

    }


    return false;

  }


  /* ================================================================
     PUBLIC COMMAND INTERFACE
     ================================================================

     The MePlay kernel can call:

       window.meplay.boot.animation.command(
         'loading-complete:"true"'
       );

     or:

       window.meplayBootAnimationCommand(
         'meplay.boot.animation.command(loading-complete:"true")'
       );

     ================================================================ */

  window.meplayBootAnimationCommand =
    function(command) {

      return receiveBootCommand(
        command
      );

    };


  window.meplay =
    window.meplay ||
    {};


  window.meplay.boot =
    window.meplay.boot ||
    {};


  window.meplay.boot.animation =
    window.meplay.boot.animation ||
    {};


  window.meplay.boot.animation.command =
    function(command) {

      /*
      Allow the kernel to send:

        loading-complete:"true"

      */

      if (
        String(command)
          .replace(/\s+/g, "")
          ===
        'loading-complete:"true"'
      ) {

        return completeLoading();

      }


      /*
      Also accept the complete command string.
      */

      return receiveBootCommand(
        command
      );

    };


  /* ================================================================
     POSTMESSAGE SUPPORT
     ================================================================

     This allows the kernel/host environment to send:

       window.postMessage(
         'meplay.boot.animation.command(loading-complete:"true")'
       )

     ================================================================ */

  window.addEventListener(
    "message",
    event => {

      if (
        typeof event.data ===
        "string"
      ) {

        receiveBootCommand(
          event.data
        );

      }


      if (
        event.data &&
        typeof event.data.command ===
        "string"
      ) {

        receiveBootCommand(
          event.data.command
        );

      }

    }
  );


  /* ================================================================
     COMPLETE LOADING
     ================================================================ */

  function completeLoading() {

    if (
      loadingCompleteReceived
    ) {

      return false;

    }


    loadingCompleteReceived =
      true;


    commandReceivedTime =
      performance.now();


    console.log(
      "MEPLAY: loading-complete:true RECEIVED."
    );


    /*
    Stop the 90 second warning timer.
    */

    if (
      warningTimer
    ) {

      clearTimeout(
        warningTimer
      );

      warningTimer =
        null;

    }


    /*
    Hide warning if it happened to already be visible.
    */

    warning.classList.remove(
      "show"
    );


    /*
    Complete the unique loading bar.
    */

    loadingComplete.style.width =
      "100%";


    loadingPercent.textContent =
      "100%";


    loadingStatus.textContent =
      "World ready";


    loadingSubtext.textContent =
      "Entering MePlay Island";


    /*
    Wait for the completion bar to visually finish
    before starting the cinematic zoom.
    */

    setTimeout(
      () => {

        startFinalBoot();

      },
      1200
    );


    return true;

  }


  /* ================================================================
     FINAL BOOT
     ================================================================ */

  function startFinalBoot() {

    if (
      finished
    ) {

      return;

    }


    /*
    Start the cinematic final sequence.
    */

    startTime =
      performance.now();


    bootWaiting =
      false;


    loadingInterface.classList.add(
      "hidden"
    );

  }


  /* ================================================================
     UPDATE
     ================================================================ */

  function updateBoot(
    now
  ) {

    /*
    --------------------------------------------------------------
    WAITING PHASE
    --------------------------------------------------------------
    */

    if (
      bootWaiting &&
      !loadingCompleteReceived
    ) {

      const elapsed =
        now -
        startTime;


      /*
      Earth appears over the first second.
      */

      const earthT =
        Math.min(
          1,
          elapsed / 1000
        );


      const earthEase =
        1 -
        Math.pow(
          1 - earthT,
          3
        );


      const earthScale =
        0.001 +
        (
          1 -
          0.001
        ) *
        earthEase;


      earthRoot.scaling.setAll(
        earthScale
      );


      /*
      Earth begins rotating once visible.
      */

      if (
        elapsed > 700
      ) {

        earthRoot.rotation.y +=
          0.00028;

      }


      /*
      Loading percentage deliberately does NOT
      fake progress toward 100%.

      It represents the boot handoff state.

      */

      if (
        elapsed < 1000
      ) {

        loadingPercent.textContent =
          "12%";

      }
      else {

        loadingPercent.textContent =
          "WAITING";

      }


      return;

    }


    /*
    --------------------------------------------------------------
    FINAL CINEMATIC ZOOM
    --------------------------------------------------------------
    */

    if (
      !bootWaiting &&
      loadingCompleteReceived &&
      !finished &&
      commandReceivedTime > 0
    ) {

      const elapsed =
        now -
        commandReceivedTime;


      /*
      Give the loading bar time to finish before
      the cinematic transition.
      */

      if (
        elapsed < 1200
      ) {

        return;

      }


      const zoomElapsed =
        elapsed -
        1200;


      const zoomDuration =
        2200;


      const t =
        Math.max(
          0,
          Math.min(
            1,
            zoomElapsed /
            zoomDuration
          )
        );


      const e =
        easeInOutCubic(
          t
        );


      /*
      ------------------------------------------------------------
      CAMERA ZOOM
      ------------------------------------------------------------
      */

      const startDistance =
        Math.max(
          earthRadius * 4.8,
          7
        );


      const endDistance =
        Math.max(
          earthRadius * 1.35,
          1.9
        );


      camera.position.z =
        lerp(
          startDistance,
          endDistance,
          e
        );


      camera.position.y =
        lerp(
          0.25,
          0.03,
          e
        );


      camera.setTarget(
        BABYLON.Vector3.Zero()
      );


      /*
      Continue Earth rotation.
      */

      earthRoot.rotation.y +=
        0.00042;


      /*
      ------------------------------------------------------------
      ENTERING STATUS
      ------------------------------------------------------------
      */

      if (
        t > 0.62
      ) {

        status.classList.add(
          "show"
        );

      }


      /*
      ------------------------------------------------------------
      WHITE TRANSITION
      ------------------------------------------------------------
      */

      if (
        t > 0.9
      ) {

        flash.style.opacity =
          String(
            smoothstep(
              (t - 0.9) /
              0.1
            )
          );

      }


      /*
      ------------------------------------------------------------
      COMPLETE
      ------------------------------------------------------------
      */

      if (
        t >= 1
      ) {

        finish();

      }

    }


    /*
    Cosmic background motion.
    */

    stars.rotation.y +=
      0.00016;


    stars.rotation.x +=
      0.000025;

  }


  /* ================================================================
     EASING
     ================================================================ */

  function clamp01(
    value
  ) {

    return Math.max(
      0,
      Math.min(
        1,
        value
      )
    );

  }


  function lerp(
    a,
    b,
    t
  ) {

    return a +
      (
        b - a
      ) *
      t;

  }


  function easeInOutCubic(
    t
  ) {

    t =
      clamp01(
        t
      );


    return t < 0.5

      ? 4 *
        t *
        t *
        t

      : 1 -
        Math.pow(
          -2 * t + 2,
          3
        ) /
        2;

  }


  function smoothstep(
    t
  ) {

    t =
      clamp01(
        t
      );


    return t *
      t *
      (
        3 -
        2 *
        t
      );

  }


  /* ================================================================
     FINISH
     ================================================================ */

  function finish() {

    if (
      finished
    ) {

      return;

    }


    finished =
      true;


    status.textContent =
      "MePlay";


    status.classList.add(
      "show"
    );


    /*
    Keep the screen white.

    The MePlay Island boot system can now take over.
    */

    flash.style.opacity =
      "1";


    /*
    The boot animation itself remains finished.
    */

    console.log(
      "MEPLAY: BOOT ANIMATION COMPLETE."
    );

  }


  /* ================================================================
     RESIZE
     ================================================================ */

  function resize() {

    engine.resize();

  }


  window.addEventListener(
    "resize",
    resize
  );


  window.addEventListener(
    "orientationchange",
    resize
  );


  /* ================================================================
     RENDER LOOP
     ================================================================ */

  engine.runRenderLoop(
    () => {

      const now =
        performance.now();


      updateBoot(
        now
      );


      scene.render();

    }
  );


  /* ================================================================
     START
     ================================================================ */

  resize();


  /*
  Earth begins loading immediately.

  This is completely independent of the
  90-second Island command timeout.
  */

  loadEarth();


})();
</script>


</body>
</html>
